server {
    listen 127.0.0.1:8000;
    server_name orgchain.tech;
    root /srv/orgchain/current/public;
    index index.php;
    server_tokens off;
    client_max_body_size 128m;
    include /etc/nginx/snippets/orgchain-pilot-access.conf;

    location ~ ^/storage/(avatars|office-settings|templates|tosa-templates)/ {
        try_files $uri =404;
    }

    location /storage/ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm-orgchain.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 180s;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }
}
